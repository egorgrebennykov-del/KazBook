name: Update homepage books

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:

jobs:
  update-homepage-books:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KazBook/.github

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: KazBook/.github/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update homepage books
        run: node updateHomepageBooks.js
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
