name: Update exchange rate and discounts

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  update-rate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Litera/.github

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Litera/.github/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update EUR/MDL rate
        run: node updateExchangeRate.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Update discounted books
        run: node updateDiscounts.js
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
